name: Build and Deploy C Student Management System

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout C source
        uses: actions/checkout@v4

      - name: Install Emscripten
        shell: bash
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest
          source ./emsdk_env.sh
          emcc --version
          echo "EMSDK_ENV=$PWD/emsdk_env.sh" >> "$GITHUB_ENV"

      - name: Compile original C program to WebAssembly
        shell: bash
        run: |
          source "$EMSDK_ENV"
          mkdir -p dist
          emcc student_management.c -O2 -o dist/student_management.html --shell-file web_shell.html -sEXIT_RUNTIME=1
          mv dist/student_management.html dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload compiled C application
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
